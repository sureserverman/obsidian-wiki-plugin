name: tests

# The suite is hermetic — it builds its own fixtures under mktemp and needs no
# vault, no registry and no populated HOME (verified by running it under
# `env -i HOME=<tmp>`). Everything it shells out to (bash, python3, git, jq,
# flock, realpath, find, grep) is preinstalled on ubuntu-latest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable and can be
      # repointed by the action owner (zizmor unpinned-uses / CWE-829). This is
      # v7.0.1 — re-resolve with:
      #   gh api repos/actions/checkout/git/ref/tags/vX.Y.Z --jq .object.sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's GITHUB_TOKEN in .git/config, where anything
          # later in the job could read or archive it (zizmor artipacked).
          persist-credentials: false

      - name: Shell syntax
        run: find plugins -name '*.sh' -exec bash -n {} \;

      - name: Python syntax
        run: python3 -m py_compile plugins/obsidian-wiki/scripts/*.py

      - name: Manifests parse
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in ['.claude-plugin/marketplace.json',
                    'plugins/obsidian-wiki/.claude-plugin/plugin.json',
                    'plugins/vault-context/.claude-plugin/plugin.json']:
              json.loads(pathlib.Path(p).read_text())
              print(f'ok {p}')
          PY

      - name: Test suite
        run: bash tests/run.sh
