# Cursor: the local plugin ports/cursor/install.sh copies into ~/.cursor/plugins/local/.
# Tests and fixtures are left out (every host but the identity host). The owner's rulings
# on the Cursor probe are at the end.
host: cursor
out: ports/cursor/vault-portfolio
# The names ruling: the skills ship as vault-portfolio and vault-compass, and Cursor takes a
# skill's name from its folder, which must match the frontmatter name. Each SKILL.md is an
# override at its core path (renamed in its frontmatter, and locked like any override) that
# moves to the new folder below. Its references and scripts stay at skills/portfolio/ and
# skills/compass/, where every script finds its siblings by path. No Cursor command ships:
# Cursor's commands are a legacy surface, and a bare /portfolio or /compass would undo the
# prefix. Each skill runs its own script lines, and the vault-portfolio skill carries the
# rules commands/portfolio.md holds.
exclude:
  - commands/*.md
moves:
  - {from: skills/portfolio/SKILL.md, to: skills/vault-portfolio/SKILL.md}
  - {from: skills/compass/SKILL.md, to: skills/vault-compass/SKILL.md}
rewrites:
  # Files reach the plugin root through a placeholder; each skill says where it is.
  - glob: '**/*.md'
    pattern: '\$\{CLAUDE_PLUGIN_ROOT\}'
    replace: '<vault-portfolio-plugin>'
  # A skill is invoked by its ruled name: /vault-portfolio, not /vault-portfolio:portfolio.
  # The text the scripts write into a vault or a sidecar keeps Claude Code's spelling (see
  # the sidecar-format override), so the two templates of that text are left alone.
  - glob: '**/*.md'
    pattern: '(^|[^$\w/.])(?<!managed by )(?<!regenerated by `)/vault-portfolio:portfolio\b'
    replace: '\1/vault-portfolio'
  - glob: scripts/records-home.py
    pattern: '/vault-portfolio:portfolio\b'
    replace: '/vault-portfolio'
  - glob: scripts/lib/eligibility.sh
    pattern: '/vault-portfolio:portfolio\b'
    replace: '/vault-portfolio'
  # The portfolio skill's SKILL.md moves to skills/vault-portfolio/, beside its references.
  - glob: 'skills/portfolio/references/*.md'
    pattern: '`\.\./SKILL\.md`'
    replace: '`../../vault-portfolio/SKILL.md`'
  - glob: skills/portfolio/references/integration.md
    pattern: '(`|\*\*)compass(`|\*\*)'
    replace: '\1vault-compass\2'
features:
  - id: skills
    status: equivalent
    note: 'the two skills ship as `vault-portfolio` and `vault-compass` (the names ruling) and are invoked as `/vault-portfolio` and `/vault-compass`; no Cursor command ships, so each skill runs its own script lines'
  - id: records-resolver
    status: native
    note: 'planning''s Cursor plugin reads the same `records_resolver` setting; point it at `scripts/records-home.py` in the installed plugin folder'
  - id: registration
    status: native
  - id: sidecar
    status: native
    note: 'the block keeps Claude Code''s `/vault-portfolio:portfolio` begin line, so one sidecar can be rebuilt from either host without rewriting it'
  - id: rollups
    status: native
  - id: compass
    status: equivalent
    note: 'no command hands over the scanner''s JSON: the `vault-compass` skill runs the scanner''s one line itself, under Cursor''s approval for agent shell commands instead of an exact-line grant'
  - id: business-layer
    status: absent
    note: 'no Cursor plugin supplies a business scanner, so the business rollup is empty unless `business_scan` or `$BUSINESS_SCAN_PATH` names a scanner script by hand'
rulings:
  names:
    choice: {vault-portfolio: prefix vault-}
    note: the two skills ship as vault-portfolio and vault-compass, after the wiki- prefix the obsidian-wiki Cursor port uses, so a same-named copy from another root cannot shadow them
    date: 2026-10-24
    evidence: cursor-probe 2026-10-24
  hook_route:
    choice: none
    note: vault-portfolio ships no hooks
    date: 2026-10-24
    evidence: cursor-probe 2026-10-24
  claude_hooks:
    choice: none
    note: vault-portfolio ships no hooks, so nothing co-runs
    date: 2026-10-24
    evidence: cursor-probe 2026-10-24
