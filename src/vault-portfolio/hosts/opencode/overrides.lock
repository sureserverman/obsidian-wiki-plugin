  host_fact: 'Core''s README is Claude Code''s: it names /vault-portfolio:<skill> commands that run the scripts under exact grants. On OpenCode a command is a prompt that runs nothing, the skills load from a skills.paths entry the installer prints, and opencode run auto-rejects a tool call on the records home outside the workspace and still exits 0 unless permission.external_directory allows it, so the README is OpenCode''s own.'
